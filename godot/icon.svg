<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0510"/>
      <stop offset="50%" style="stop-color:#150a20"/>
      <stop offset="100%" style="stop-color:#1a0f2a"/>
    </linearGradient>
    <linearGradient id="eye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#8b6914"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo -->
  <rect width="128" height="128" fill="url(#bg)" rx="8"/>
  
  <!-- Ojo lovecraftiano -->
  <ellipse cx="64" cy="64" rx="40" ry="32" fill="#0d0d12" stroke="#2a2a3a" stroke-width="2"/>
  
  <!-- Iris -->
  <ellipse cx="64" cy="64" rx="24" ry="20" fill="url(#eye)"/>
  
  <!-- Pupila (grieta) -->
  <ellipse cx="64" cy="64" rx="8" ry="16" fill="#0a0a0f"/>
  
  <!-- Brillo -->
  <ellipse cx="56" cy="56" rx="6" ry="4" fill="#ffffff" opacity="0.3"/>
  
  <!-- Grietas decorativas -->
  <path d="M 20 30 L 35 45 M 108 30 L 93 45 M 20 98 L 35 83 M 108 98 L 93 83" 
        stroke="#3a2a4a" stroke-width="2" fill="none"/>
  
  <!-- Símbolo arcano inferior -->
  <path d="M 64 100 L 60 110 L 64 108 L 68 110 Z" fill="#5a2a6a"/>
</svg>
